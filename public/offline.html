<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Den" />
    <title>Offline · Thievn's Den</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding:
          calc(1.5rem + env(safe-area-inset-top))
          calc(1.25rem + env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom))
          calc(1.25rem + env(safe-area-inset-left));
        background: #0B0D12;
        color: #F2E6C9;
        font: 1.05rem/1.5 Outfit, ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 22rem; }
      p { margin: 0 0 0.8rem; color: rgba(242, 230, 201, 0.74); }
      h1 {
        margin: 0 0 0.6rem;
        color: #F2E6C9;
        font-size: 2rem;
        letter-spacing: 0.04em;
      }
      a {
        color: #0B0D12;
        background: #D4A24C;
        display: inline-block;
        margin-top: 0.6rem;
        padding: 0.7rem 1.1rem;
        border-radius: 999px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
